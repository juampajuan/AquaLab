{% extends "base.html" %}
{% block title %}Confirmar prueba · AquaLab{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8 col-lg-6">
  <h1 class="h3">Confirmar prueba</h1>
  <p>Se agregará la prueba {{ prueba }} al estudio {{ estudio.pk }} (muestra PI {{ estudio.muestra.numero_pi }}).</p>
  <div class="d-flex gap-2 flex-wrap">
    <form method="post">
      {% csrf_token %}<input type="hidden" name="prueba" value="{{ prueba.pk }}">
      <button name="accion" value="confirmar" class="btn btn-primary">Confirmar</button>
    </form>
    <a class="btn btn-outline-secondary" href="{% url 'estudios:agregar_prueba' estudio.pk %}">Volver</a>
    <a class="btn btn-outline-danger" href="{% url 'estudios:detalle' estudio.pk %}">Cancelar</a>
  </div>
</div></div>
{% endblock %}
