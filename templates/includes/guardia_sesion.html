{% load static %}
{% if user.is_authenticated and huella_sesion %}
<div id="sesion-aviso" class="mx-auto my-10 max-w-md px-4" role="status" aria-live="polite">
  <p id="sesion-mensaje" class="mb-4">Comprobando la sesión…</p>
  <button id="sesion-reintentar" type="button" class="btn btn-primario">Reintentar</button>
  <a href="{% url 'usuarios:login' %}" class="btn-link ml-3">Ir al inicio de sesión</a>
</div>
<script src="{% static 'usuarios/sesion.js' %}" defer data-sesion-guardia
        data-huella="{{ huella_sesion }}" data-verificar="{% url 'usuarios:sesion' %}"
        data-login="{% url 'usuarios:login' %}"></script>
{% endif %}
