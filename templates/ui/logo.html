{# Identidad de AquaLab. claro=True para fondos oscuros. #}
<a href="{% url 'inicio' %}" class="flex items-center gap-3">
  <span class="flex size-10 items-center justify-center rounded-lg {% if claro %}bg-white/10 text-cian ring-1 ring-white/20{% else %}bg-marino text-cian{% endif %}">
    {% include "ui/icono.html" with nombre="droplet" clase="size-5" %}
  </span>
  <span class="leading-tight">
    <span class="block text-base font-bold {% if claro %}text-white{% else %}text-marino{% endif %}">AquaLab</span>
    <span class="block text-[11px] font-semibold tracking-wide uppercase {% if claro %}text-white/70{% else %}text-tinta-suave{% endif %}">Análisis de agua</span>
  </span>
</a>
