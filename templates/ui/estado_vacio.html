{# Estado vacío. Parámetros: mensaje, icono (opc.), accion_texto y accion_url (opc.). #}
<div class="flex flex-col items-center px-6 py-12 text-center" data-componente="estado-vacio">
  <div class="flex size-14 items-center justify-center rounded-full bg-fondo-hundido text-tinta-suave">
    {% include "ui/icono.html" with nombre=icono|default:"inbox" clase="size-7" %}
  </div>
  <p class="mt-4 text-sm text-tinta-suave">{{ mensaje }}</p>
  {% if accion_url %}
    <a href="{{ accion_url }}" class="btn btn-secundario mt-5">{{ accion_texto }}</a>
  {% endif %}
</div>
