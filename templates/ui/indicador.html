{# Indicador numérico. Parámetros: nombre, titulo, valor, icono; url opcional. #}
{% if url %}<a href="{{ url }}" class="tarjeta flex items-center gap-4 p-5 hover:shadow-nivel2 focus-visible:outline-2 focus-visible:outline-cian-texto" data-indicador="{{ nombre }}">
{% else %}<div class="tarjeta flex items-center gap-4 p-5" data-indicador="{{ nombre }}">{% endif %}
  <span class="flex size-12 shrink-0 items-center justify-center rounded-lg bg-cian-suave text-cian-texto">
    {% include "ui/icono.html" with nombre=icono clase="size-6" %}
  </span>
  <span>
    <span class="block text-[11px] font-semibold tracking-wide text-tinta-suave uppercase">{{ titulo }}</span>
    <span class="numeros block text-3xl font-bold text-marino" data-valor>{{ valor }}</span>
  </span>
{% if url %}</a>{% else %}</div>{% endif %}
