[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["specs", ".specify", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["."]
norecursedirs = [".git", ".specify", "specs", "archivos_aparte", "templates"]
