# Blueprint de Render: un servicio web (Docker) y una base PostgreSQL, ambos en el plan gratuito.
# Las claves secretas no van acá: SECRET_KEY la genera Render y ASISTENTE_API_KEY se carga a mano
# en el panel (Environment).
databases:
  - name: aqualab-db
    plan: free
    databaseName: aqualab
    user: aqualab

services:
  - type: web
    name: aqualab
    runtime: docker
    plan: free
    healthCheckPath: /usuarios/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aqualab-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: AQUALAB_HTTPS
        value: "True"
      - key: AQUALAB_ENTORNO
        value: demo
      - key: ASISTENTE_API_KEY
        sync: false
      - key: AQUALAB_URL_BASE
        sync: false
