<div class="flex flex-col lg:flex-row w-full min-h-screen bg-surface-container-lowest overflow-hidden">
<!-- Left Hero & Narrative Panel (60% Desktop) -->
<div class="relative w-full lg:w-[60%] min-h-[420px] lg:min-h-screen overflow-hidden flex flex-col justify-between p-8 sm:p-12 lg:p-16 text-on-primary">
<!-- Background Image -->
<img alt="Laboratorio de análisis de agua moderno con instrumental de precisión y cristalería científica" class="absolute inset-0 w-full h-full object-cover scale-105 motion-safe:transition-transform motion-safe:duration-1000" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7nGvvargSseCczWccvS2IWO_I0dfcDz0UPG5wv_dYjevCH6nRNeb8U5liMeWV0zytq-HTS6QMYlMa7lnF3hoZmj08q959SmYIxz1-0rlSjErsn6aa_aQjuSwn4bw8Z0EDPhkP7kxXLdBUpdM51HBiIZXDYpSgJUK7ZurI1y2wILNecrbqDtZhEDkNRF04XfAt1v9iD9jb8CZYCF8NAYrSdSShOiDIRrsyFui1V-4">
<!-- Gradient Overlays for High-Contrast Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-primary via-primary-container/85 to-primary-container/60 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-r from-primary/90 via-transparent to-transparent"></div>
<!-- Subtle Geometric Analytical Pattern Overlay -->
<div class="absolute inset-0 opacity-10 pointer-events-none bg-[radial-gradient(#71f8e4_1px,transparent_1px)] [background-size:24px_24px]"></div>
<!-- Top Branding Element -->
<div class="relative z-10 flex items-center justify-between">
<div class="flex items-center gap-3.5">
<div class="w-11 h-11 rounded-xl bg-surface-container-lowest/10 backdrop-blur-md flex items-center justify-center text-tertiary-fixed shadow-md">
<span class="material-symbols-outlined text-headline-lg" style="font-variation-settings: 'FILL' 1;">biotech</span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-1.5">
<span class="font-display-lg text-headline-lg tracking-tight font-bold text-surface-container-lowest">AquaLab</span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-tertiary-fixed mb-2"></span>
</div>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary-fixed">Análisis &amp; Control</span>
</div>
</div>

</div>
<!-- Bottom Hero Text & Scientific Reassurance -->
<div class="relative z-10 max-w-2xl mt-16 lg:mt-auto">

<h1 class="font-display-lg text-display-lg text-surface-container-lowest font-bold leading-tight tracking-tight mb-4">
          Gestión de muestras y análisis de agua
        </h1>
<p class="font-body-lg text-body-lg text-surface-container-high/90 max-w-xl font-normal leading-relaxed">Clientes, muestras y estudios del laboratorio en un solo lugar.</p>
<!-- Micro Analytical Metrics Bar -->

</div>
</div>
<!-- Right Interaction Panel (40% Desktop) -->
<div class="w-full lg:w-[40%] bg-surface-container-lowest flex flex-col justify-center px-8 sm:px-12 md:px-16 lg:px-20 py-12 lg:py-16 shadow-xl relative z-20">
<div class="max-w-md w-full mx-auto flex flex-col">
<!-- Error Alert Banner -->
<div class="mb-8 p-4 rounded-xl bg-error-container text-on-error-container flex items-start gap-3 shadow-sm transition-all duration-300" id="login-error-banner">
<span class="material-symbols-outlined text-headline-md shrink-0 text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<div class="flex-1">
<p class="font-title-md text-body-md font-semibold text-error leading-snug">Usuario o contraseña incorrectos</p>

</div>
<button aria-label="Cerrar alerta" class="text-on-error-container/60 hover:text-on-error-container transition-colors p-1" onclick="document.getElementById('login-error-banner').classList.add('hidden')" type="button">
<span class="material-symbols-outlined text-body-md">close</span>
</button>
</div>
<!-- Form Header -->
<div class="mb-8">

<h2 class="font-display-lg text-headline-lg lg:text-display-lg font-bold text-primary tracking-tight">
            Iniciar sesión
          </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5">Ingresá con tu correo y contraseña.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5" id="auth-form" onsubmit="event.preventDefault(); validateForm();">
<!-- Field 1: Correo electrónico -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md font-medium text-on-surface flex justify-between items-center" for="email">
<span class="">Correo electrónico</span>

</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none transition-colors" id="email-icon">mail</span>
<input class="w-full h-11 pl-11 pr-4 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg outline-none placeholder:text-outline/70 focus:bg-surface-container-lowest focus:shadow-md transition-all" id="email" name="email" placeholder="nombre@empresa.com" required="" type="email">
</div>
</div>
<!-- Field 2: Contraseña -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md font-medium text-on-surface" for="password">
                Contraseña
              </label>

</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-title-md pointer-events-none transition-colors" id="pass-icon">key</span>
<input class="w-full h-11 pl-11 pr-11 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-lg outline-none placeholder:text-outline/70 focus:bg-surface-container-lowest focus:shadow-md transition-all" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3.5 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center rounded" id="toggle-password" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-title-md" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Additional Security Checkbox -->

<!-- Submit Button -->
<button class="w-full mt-2 h-12 bg-primary-container text-on-primary font-label-md text-body-md font-semibold rounded-lg shadow-md hover:bg-primary transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.99] focus:outline-none" type="submit">
<span class="">Ingresar</span>
<span class="material-symbols-outlined text-title-md">arrow_forward</span>
</button>
<!-- Register Prompt Link -->
<div class="text-center pt-5 border-t border-surface-container-high/60 mt-2">
<p class="font-body-md text-body-md text-on-surface-variant">¿No tenés cuenta? <a href="#" class="font-semibold text-primary underline hover:text-secondary transition-colors">Crear cuenta</a></p>
</div>
</form>
<!-- Compliance & Security Assurance Footer -->

</div>
</div>
</div>
<script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggle-password-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }

    function validateForm() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const banner = document.getElementById('login-error-banner');

      if (!email || !password || !email.includes('@')) {
        banner.classList.remove('hidden');
        banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        // Form submitted correctly in normal flow
        banner.classList.add('hidden');
      }
    }
  </script>
</div></main>

</body></html>
