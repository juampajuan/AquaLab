name: CI

on:
  pull_request:

jobs:
  ruff-y-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: aqualab
          POSTGRES_USER: aqualab
          POSTGRES_PASSWORD: aqualab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqualab -d aqualab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: clave-solo-para-ci
      DEBUG: "False"
      DATABASE_URL: postgres://aqualab:aqualab@localhost:5432/aqualab
      # Misma versión que el Dockerfile.
      TAILWIND_VERSION: v4.3.3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Mismas librerías que el Dockerfile. El runner ya trae casi todas; los espejos de apt a
      # veces no resuelven (DNS de Azure), así que se reintenta y, si igual falla, se sigue:
      # el paso «WeasyPrint instalado» verifica que de verdad genere un PDF.
      - name: Librerías de sistema de WeasyPrint
        run: |
          paquetes="libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core"
          for intento in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update || true
            if sudo apt-get -o Acquire::Retries=3 install -y $paquetes; then
              exit 0
            fi
            echo "apt-get falló (intento $intento); reintento en 15 s"
            sleep 15
          done
          echo "::warning::No se pudieron instalar las librerías con apt; se usan las del runner."

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: WeasyPrint instalado
        run: python -c "import weasyprint; weasyprint.HTML(string='<p>ok</p>').write_pdf()"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run

      - name: CSS compilado al día
        run: |
          curl -sSfL -o tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tailwindcss
          ./tailwindcss -i static/src/aqualab.css -o static/css/aqualab.css --minify
          rm tailwindcss
          # git status detecta también el archivo sin commitear (git diff no lo vería).
          if [ -n "$(git status --porcelain static/css/aqualab.css)" ]; then
            echo "static/css/aqualab.css no está al día: recompilá el CSS y commitealo."
            exit 1
          fi

      - name: pytest
        run: pytest

      # node:test viene con Node: sin dependencias ni package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tests de JavaScript
        run: node --test usuarios/tests/js config/tests/js estudios/tests/js
